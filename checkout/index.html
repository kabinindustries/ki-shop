<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your cart | Kabin Industries</title><meta name="description" content="">
<meta property="og:title" content="Your cart | Kabin Industries"><meta property="og:type" content="product">

<!--META_VERIFY--><style>:root{--bg:#f6f1e7;--ink:#141414;--accent:#e2391b;--muted:#6b6458;--card:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:3px solid var(--ink);background:var(--card)}
.brand{font-weight:900;letter-spacing:.08em;color:var(--ink);text-decoration:none;font-size:18px}
.etsy{color:var(--accent);font-weight:700;text-decoration:none;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{line-height:1.15;margin:0 0 12px}.hero{font-size:clamp(26px,5vw,44px);max-width:16ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:2px solid var(--ink);padding:8px;color:var(--ink);text-decoration:none;font-size:13px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#ddd}.card b{color:var(--accent)}
.product{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.product img{width:100%;height:auto;border:3px solid var(--ink);background:#ddd}
.price{font-size:24px;font-weight:800;color:var(--accent);margin:4px 0 16px}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:14px 22px;font-weight:800;text-decoration:none;border:3px solid var(--ink);letter-spacing:.03em}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.note{color:var(--muted);font-size:14px}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);padding:10px;margin-bottom:10px}
.line img{width:72px;height:72px;object-fit:cover}.line .btn{padding:10px 14px;font-size:14px}
.sum{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:16px 0}
.coupon{background:#fff3b0;border:2px dashed var(--ink);padding:10px;margin:12px 0}
footer{border-top:3px solid var(--ink);padding:16px;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:640px){.product{grid-template-columns:1fr}.line{grid-template-columns:56px 1fr}.line img{width:56px;height:56px}.line .btn{grid-column:1/-1;text-align:center}}
</style></head><body><header><a class="brand" href="/">KABIN INDUSTRIES</a><a class="etsy" href="https://www.etsy.com/shop/KabinIndustries">Shop on Etsy ↗</a></header>
<main><h1>Your cart</h1><div id="cart"><p>Loading…</p></div><script src="/config.js"></script><script>(async function(){
  var el=document.getElementById('cart');
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var q=new URLSearchParams(location.search);
  var raw=q.get('products')||'';
  var coupon=q.get('coupon')||'';
  var data;
  try{data=await (await fetch('/data.json',{cache:'no-store'})).json();}catch(e){el.innerHTML='<p>Could not load products. <a class="btn" href="https://www.etsy.com/shop/KabinIndustries">Visit our Etsy shop</a></p>';return;}
  var items=[],total=0;
  raw.split(',').forEach(function(part){
    part=part.trim(); if(!part) return;
    var bits=part.split(':'); var cid=decodeURIComponent(bits[0]); var qty=parseInt(bits[1]||'1',10)||1;
    var eid=data.M[cid]; var l=eid&&data.L[eid];
    if(l){items.push({l:l,qty:qty}); var p=parseFloat(l.p); if(!isNaN(p)) total+=p*qty;}
  });
  if(!items.length){el.innerHTML='<p>Your cart is empty.</p><p><a class="btn" href="https://www.etsy.com/shop/KabinIndustries">Shop Kabin Industries on Etsy</a></p>';return;}
  if(window.KI_FORWARD&&items.length===1){location.replace(items[0].l.u);return;}
  var h='';
  items.forEach(function(it){
    var l=it.l;
    h+='<div class="line"><img src="'+esc(l.i)+'" alt=""><div><strong>'+esc(l.t)+'</strong><br>Qty '+it.qty+(l.p?' · $'+esc(l.p)+' each':'')+'</div><a class="btn" href="'+esc(l.u)+'">Check out on Etsy</a></div>';
  });
  if(coupon){h+='<div class="coupon">Coupon <strong>'+esc(coupon)+'</strong> — enter it at Etsy checkout.</div>';}
  h+='<div class="sum"><span>Estimated subtotal</span><span>$'+total.toFixed(2)+' USD</span></div>';
  h+='<p class="note">Kabin Industries orders are placed and fulfilled through our Etsy shop. Choose size/color and complete payment on each Etsy listing.</p>';
  el.innerHTML=h;
})();
</script></main><footer>Kabin Industries · Orders are placed and fulfilled securely through our Etsy shop.</footer></body></html>
